<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FokusKita — Task & Pomodoro Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>FokusKita</h1>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.2rem;">Starter Project Siap GitHub</p>
      </div>
      <span class="badge">v1.0.0 • Git Ready</span>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Pomodoro Timer</h2>
        <div class="mode-buttons">
          <button id="btnFokus" class="active-mode" onclick="setMode(25, 'btnFokus')">Fokus 25m</button>
          <button id="btnShort" onclick="setMode(5, 'btnShort')">Rehat 5m</button>
          <button id="btnLong" onclick="setMode(15, 'btnLong')">Rehat 15m</button>
        </div>
        <div id="timer" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="startBtn" class="primary">Mulai</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="card">
        <h2>Daftar Tugas Proyek</h2>
        <div class="task-input-group">
          <input type="text" id="taskInput" placeholder="Tambah tugas baru..." />
          <button id="addTaskBtn" class="primary">Tambah</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
        <div class="stats">
          <span id="taskCount">0 tugas belum selesai</span>
          <span>Tersimpan otomatis</span>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
