<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FokusKita v1.1 — Task & Pomodoro Tracker</title>
  <style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-hover: #0284c7;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
}

body.light-mode {
  --bg: #f1f5f9;
  --card: #ffffff;
  --border: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #0284c7;
  --accent-hover: #0369a1;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem;
  display: flex;
  justify-content: center;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.container {
  width: 100%;
  max-width: 860px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.badge {
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent);
  padding: 0.35rem 0.75rem;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 1.5rem;
}

@media (max-width: 700px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
}

.card h2 {
  font-size: 1.1rem;
  margin-bottom: 1rem;
  color: var(--text);
}

.timer-display {
  font-size: 3.25rem;
  font-weight: 800;
  text-align: center;
  margin: 1.25rem 0;
  letter-spacing: 2px;
  color: var(--accent);
}

.mode-buttons, .timer-controls, .filter-tabs {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin-bottom: 1rem;
}

.filter-tabs {
  justify-content: flex-start;
}

button {
  background: var(--border);
  color: var(--text);
  border: none;
  padding: 0.55rem 0.9rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: all 0.15s ease;
}

button:hover {
  opacity: 0.9;
}

button.primary {
  background: var(--accent);
  color: #fff;
}

button.primary:hover {
  background: var(--accent-hover);
}

button.active-mode {
  background: rgba(56, 189, 248, 0.2);
  color: var(--accent);
  border: 1px solid var(--accent);
}

.task-input-group {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.85rem;
}

input[type="text"], select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.6rem 0.75rem;
  border-radius: 8px;
  font-size: 0.88rem;
}

input[type="text"] {
  flex: 1;
}

.task-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.task-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  padding: 0.7rem 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.task-item.completed span.task-title {
  text-decoration: line-through;
  color: var(--muted);
}

.task-left {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
}

.prio-badge {
  font-size: 0.7rem;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  font-weight: 700;
  text-transform: uppercase;
}

.prio-Tinggi { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
.prio-Sedang { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
.prio-Rendah { background: rgba(34, 197, 94, 0.2); color: var(--success); }

.delete-btn {
  background: transparent;
  color: var(--danger);
  padding: 0.25rem 0.5rem;
  font-size: 0.8rem;
}

.stats {
  margin-top: 1rem;
  font-size: 0.8rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>FokusKita</h1>
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem;">Repositori: Zehna/fokus-kita-app</p>
      </div>
      <div class="header-actions">
        <button id="themeBtn">☀️ Mode Terang</button>
        <span class="badge">v1.1.0 • Update</span>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Pomodoro Timer</h2>
        <div class="mode-buttons">
          <button id="btnFokus" class="active-mode" onclick="setMode(25, 'btnFokus')">Fokus 25m</button>
          <button id="btnShort" onclick="setMode(5, 'btnShort')">Rehat 5m</button>
          <button id="btnLong" onclick="setMode(15, 'btnLong')">Rehat 15m</button>
        </div>
        <div id="timer" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="startBtn" class="primary">Mulai</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="card">
        <h2>Daftar Tugas Proyek</h2>
        <div class="task-input-group">
          <input type="text" id="taskInput" placeholder="Tambah tugas baru..." />
          <select id="prioritySelect">
            <option value="Tinggi">Prioritas Tinggi</option>
            <option value="Sedang" selected>Prioritas Sedang</option>
            <option value="Rendah">Prioritas Rendah</option>
          </select>
          <button id="addTaskBtn" class="primary">Tambah</button>
        </div>
        <div class="filter-tabs">
          <button id="fltAll" class="active-mode" onclick="setFilter('all', 'fltAll')">Semua</button>
          <button id="fltActive" onclick="setFilter('active', 'fltActive')">Aktif</button>
          <button id="fltDone" onclick="setFilter('done', 'fltDone')">Selesai</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
        <div class="stats">
          <span id="taskCount">0 tugas aktif</span>
          <span>Bunyi alarm aktif 🔔</span>
        </div>
      </div>
    </div>
  </div>
  <script>
const defaultTasks = [
  { id: 1, text: "Upload Versi 1.0 ke github.com/Zehna/fokus-kita-app", priority: "Tinggi", done: true },
  { id: 2, text: "Uji fitur baru Versi 1.1 (Tema Terang/Gelap & Prioritas)", priority: "Tinggi", done: false },
  { id: 3, text: "Commit pembaruan Versi 1.1 ke branch main", priority: "Sedang", done: false }
];

let tasks = JSON.parse(localStorage.getItem("fokuskita_v11_tasks")) || defaultTasks;
let currentFilter = "all";
let timeLeft = 25 * 60;
let timerId = null;
let isRunning = false;

const timerEl = document.getElementById("timer");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const taskInput = document.getElementById("taskInput");
const prioritySelect = document.getElementById("prioritySelect");
const addTaskBtn = document.getElementById("addTaskBtn");
const taskList = document.getElementById("taskList");
const taskCount = document.getElementById("taskCount");
const themeBtn = document.getElementById("themeBtn");

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

themeBtn.addEventListener("click", () => {
  document.body.classList.toggle("light-mode");
  const isLight = document.body.classList.contains("light-mode");
  themeBtn.textContent = isLight ? "🌙 Mode Gelap" : "☀️ Mode Terang";
});

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = (sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function updateTimerDisplay() {
  timerEl.textContent = formatTime(timeLeft);
}

window.setMode = function(minutes, btnId) {
  clearInterval(timerId);
  isRunning = false;
  startBtn.textContent = "Mulai";
  timeLeft = minutes * 60;
  updateTimerDisplay();
  document.querySelectorAll(".mode-buttons button").forEach(b => b.classList.remove("active-mode"));
  document.getElementById(btnId).classList.add("active-mode");
};

startBtn.addEventListener("click", () => {
  if (isRunning) {
    clearInterval(timerId);
    isRunning = false;
    startBtn.textContent = "Lanjut";
  } else {
    isRunning = true;
    startBtn.textContent = "Jeda";
    timerId = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerDisplay();
      } else {
        clearInterval(timerId);
        isRunning = false;
        startBtn.textContent = "Mulai";
        playBeep();
        alert("Waktu sesi selesai!");
      }
    }, 1000);
  }
});

resetBtn.addEventListener("click", () => {
  clearInterval(timerId);
  isRunning = false;
  startBtn.textContent = "Mulai";
  timeLeft = 25 * 60;
  updateTimerDisplay();
});

function saveTasks() {
  localStorage.setItem("fokuskita_v11_tasks", JSON.stringify(tasks));
}

window.setFilter = function(filter, btnId) {
  currentFilter = filter;
  document.querySelectorAll(".filter-tabs button").forEach(b => b.classList.remove("active-mode"));
  document.getElementById(btnId).classList.add("active-mode");
  renderTasks();
};

function renderTasks() {
  taskList.innerHTML = "";
  const filtered = tasks.filter(t => {
    if (currentFilter === "active") return !t.done;
    if (currentFilter === "done") return t.done;
    return true;
  });

  filtered.forEach(task => {
    const prio = task.priority || "Sedang";
    const li = document.createElement("li");
    li.className = "task-item" + (task.done ? " completed" : "");
    li.innerHTML = `
      <div class="task-left" onclick="toggleTask(${task.id})">
        <input type="checkbox" ${task.done ? "checked" : ""} />
        <span class="prio-badge prio-${prio}">${prio}</span>
        <span class="task-title">${task.text}</span>
      </div>
      <button class="delete-btn" onclick="deleteTask(${task.id})">Hapus</button>
    `;
    taskList.appendChild(li);
  });
  const remaining = tasks.filter(t => !t.done).length;
  taskCount.textContent = `${remaining} tugas aktif dari total ${tasks.length}`;
}

window.toggleTask = function(id) {
  tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
  saveTasks();
  renderTasks();
};

window.deleteTask = function(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
  renderTasks();
};

function addTask() {
  const val = taskInput.value.trim();
  if (!val) return;
  tasks.push({ id: Date.now(), text: val, priority: prioritySelect.value, done: false });
  taskInput.value = "";
  saveTasks();
  renderTasks();
}

addTaskBtn.addEventListener("click", addTask);
taskInput.addEventListener("keypress", e => {
  if (e.key === "Enter") addTask();
});

updateTimerDisplay();
renderTasks();

</script>
</body>
</html>
