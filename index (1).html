<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FokusKita v1.1 — Task & Pomodoro Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>FokusKita</h1>
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem;">Repositori: Zehna/fokus-kita-app</p>
      </div>
      <div class="header-actions">
        <button id="themeBtn">☀️ Mode Terang</button>
        <span class="badge">v1.1.0 • Update</span>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Pomodoro Timer</h2>
        <div class="mode-buttons">
          <button id="btnFokus" class="active-mode" onclick="setMode(25, 'btnFokus')">Fokus 25m</button>
          <button id="btnShort" onclick="setMode(5, 'btnShort')">Rehat 5m</button>
          <button id="btnLong" onclick="setMode(15, 'btnLong')">Rehat 15m</button>
        </div>
        <div id="timer" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="startBtn" class="primary">Mulai</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="card">
        <h2>Daftar Tugas Proyek</h2>
        <div class="task-input-group">
          <input type="text" id="taskInput" placeholder="Tambah tugas baru..." />
          <select id="prioritySelect">
            <option value="Tinggi">Prioritas Tinggi</option>
            <option value="Sedang" selected>Prioritas Sedang</option>
            <option value="Rendah">Prioritas Rendah</option>
          </select>
          <button id="addTaskBtn" class="primary">Tambah</button>
        </div>
        <div class="filter-tabs">
          <button id="fltAll" class="active-mode" onclick="setFilter('all', 'fltAll')">Semua</button>
          <button id="fltActive" onclick="setFilter('active', 'fltActive')">Aktif</button>
          <button id="fltDone" onclick="setFilter('done', 'fltDone')">Selesai</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
        <div class="stats">
          <span id="taskCount">0 tugas aktif</span>
          <span>Bunyi alarm aktif 🔔</span>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
